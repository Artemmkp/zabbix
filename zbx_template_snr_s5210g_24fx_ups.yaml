              description: |
                Линк поднят, но согласовался на меньшей скорости (например, 1000 -> 100 Мбит/с): плохой кабель/коннектор, проблема автосогласования или более медленный SFP.
                Закрывается, когда скорость вернулась, линк упал, или вручную.
                Отключить для порта: макрос {$IF.SPEED.CONTROL:"<ifName>"}=0.
              manual_close: 'YES'
              dependencies:
                - name: 'Интерфейс {#IFNAME}({#IFALIAS}): нет линка'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/SNR-S5210G-24FX-UPS by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/SNR-S5210G-24FX-UPS by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/SNR-S5210G-24FX-UPS by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
                  recovery_expression: 'last(/SNR-S5210G-24FX-UPS by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0'
              tags:
