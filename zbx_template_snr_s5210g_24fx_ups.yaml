              event_name: 'Интерфейс {#IFNAME}({#IFALIAS}): высокая загрузка канала (>{$IF.UTIL.MAX:"{#IFNAME}"}% от {ITEM.LASTVALUE2})'
              opdata: 'Вход: {ITEM.LASTVALUE1}, выход: {ITEM.LASTVALUE3}, скорость: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: |
                Средний входящий или исходящий трафик за {$IF.UTIL.TIME} превышает {$IF.UTIL.MAX:"{#IFNAME}"}% скорости порта.
                Скорость берётся фактическая (IF-MIB::ifHighSpeed), поэтому SFP на 1G в 10G-порту считается от 1 Гбит/с.
