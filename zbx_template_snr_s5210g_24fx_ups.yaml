  triggers:
    - uuid: '19d43101814e4f9a8468b2628226b661'
      expression: 'last(/SNR-S5210G-24FX-UPS by SNMP/snr.power.ac)=2 or last(/SNR-S5210G-24FX-UPS by SNMP/snr.battery.status)=2'
      name: 'AC power lost, switch is running on battery'
      opdata: 'AC: {ITEM.LASTVALUE1}, battery: {ITEM.LASTVALUE2}'
      priority: HIGH
      description: 'Fires when AC power is abnormal (priACPowerStatus=2) or the battery is discharging (priBatteryStatus=2). Resolves when both are back to normal.'
      tags:
        - tag: scope
          value: availability
    - uuid: '802f5808195545b59dc112d2a237ade4'
      expression: 'last(/SNR-S5210G-24FX-UPS by SNMP/snr.battery.level)<{$UPS.BATTERY.LEVEL.MIN} and last(/SNR-S5210G-24FX-UPS by SNMP/snr.battery.status)=2'
      name: 'UPS battery level is low (<{$UPS.BATTERY.LEVEL.MIN}%)'
      opdata: 'Level: {ITEM.LASTVALUE1}, status: {ITEM.LASTVALUE2}'
      priority: HIGH
      description: 'Fires only while the switch is running on battery (priBatteryStatus=2, discharging), so a low level during recharge after an outage does not alert.'
      tags:
        - tag: scope
          value: availability
