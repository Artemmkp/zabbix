  triggers:
    - uuid: '19d43101814e4f9a8468b2628226b661'
      expression: 'last(/SNR-S5210G-24FX-UPS by SNMP/snr.power.ac)=2 or last(/SNR-S5210G-24FX-UPS by SNMP/snr.battery.status)=2'
      name: 'Пропало питание AC, коммутатор работает от батареи'
      opdata: 'AC: {ITEM.LASTVALUE1}, батарея: {ITEM.LASTVALUE2}'
      priority: HIGH
      description: 'Срабатывает, если питание AC в аварии (priACPowerStatus=2) или батарея разряжается (priBatteryStatus=2). Закрывается, когда оба параметра вернулись в норму.'
      tags:
        - tag: scope
          value: availability
    - uuid: '802f5808195545b59dc112d2a237ade4'
      expression: 'last(/SNR-S5210G-24FX-UPS by SNMP/snr.battery.level)<{$UPS.BATTERY.LEVEL.MIN} and last(/SNR-S5210G-24FX-UPS by SNMP/snr.battery.status)=2'
      name: 'Низкий заряд батареи ИБП (<{$UPS.BATTERY.LEVEL.MIN}%)'
      opdata: 'Заряд: {ITEM.LASTVALUE1}, статус: {ITEM.LASTVALUE2}'
      priority: HIGH
      description: 'Срабатывает только при работе от батареи (priBatteryStatus=2, разряд), поэтому низкий заряд во время подзарядки после отключения питания не вызывает тревогу.'
      tags:
        - tag: scope
          value: availability
