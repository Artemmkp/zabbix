              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'avg(/SNR-S5210G-24FX-UPS by SNMP/net.if.in[ifHCInOctets.{#SNMPINDEX}],{$IF.UTIL.TIME})<(({$IF.UTIL.MAX:"{#IFNAME}"}-5)/100)*last(/SNR-S5210G-24FX-UPS by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) and avg(/SNR-S5210G-24FX-UPS by SNMP/net.if.out[ifHCOutOctets.{#SNMPINDEX}],{$IF.UTIL.TIME})<(({$IF.UTIL.MAX:"{#IFNAME}"}-5)/100)*last(/SNR-S5210G-24FX-UPS by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])'
