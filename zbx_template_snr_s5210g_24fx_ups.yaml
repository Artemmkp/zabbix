              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: '(change(/SNR-S5210G-24FX-UPS by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0 and last(/SNR-S5210G-24FX-UPS by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}],#2)>0) or last(/SNR-S5210G-24FX-UPS by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 or {$IF.SPEED.CONTROL:"{#IFNAME}"}=0'
              name: 'Интерфейс {#IFNAME}({#IFALIAS}): скорость порта снизилась'
              opdata: 'Текущая скорость: {ITEM.LASTVALUE2}'
